<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melvin Paul — Product Builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c;
    --ink-2:#1b1f26;
    --bone:#ece7dc;
    --bone-dim:#b9b3a4;
    --slate:#8a8f98;
    --brass:#b6905a;
    --sage:#6e9c7c;
    --gold:#c9a227;
    --rust:#a85c42;
    --hair:#33383f;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brass);color:var(--ink);}

  a{color:inherit;text-decoration:none;}

  .display{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- NAV ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(20,23,28,0.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hair);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0;
  }
  .nav-brand{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bone);
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-brand span{color:var(--brass);}
  .nav-brand a{transition:color .15s ease;}
  .nav-brand a:hover{color:var(--brass);}
  .crumb-sep{
    color:var(--hair);
    font-weight:400;
  }
  .crumb-current{
    color:var(--slate);
    font-weight:500;
  }
  .nav-links{
    display:flex; gap:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }
  .nav-links a:hover{color:var(--brass);}

  /* ---------- HERO ---------- */
  .hero{
    padding:84px 0 56px;
    border-bottom:1px solid var(--hair);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:18px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1px; background:var(--brass);
    display:inline-block;
  }
  .hero h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(38px, 6vw, 68px);
    line-height:1.02;
    margin:0 0 22px;
    letter-spacing:0.005em;
    max-width:820px;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--sage);
  }
  .hero p.lead{
    max-width:560px;
    font-size:17px;
    line-height:1.65;
    color:var(--bone-dim);
    margin:0 0 34px;
  }

  .ticket-row{
    display:flex; flex-wrap:wrap; gap:14px;
  }
  .ticket-stat{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bone-dim);
    border:1px dashed var(--hair);
    padding:10px 14px;
    display:flex; flex-direction:column; gap:4px;
    min-width:120px;
  }
  .ticket-stat b{
    font-family:'Oswald', sans-serif;
    font-size:22px;
    color:var(--bone);
    font-weight:600;
    letter-spacing:0;
  }

  /* ---------- SECTION LABEL ---------- */
  .section-label{
    padding:44px 0 22px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--hair);
    margin-bottom:34px;
  }
  .section-label h2{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.02em;
  }
  .section-label .note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  /* ---------- CASE STUDY LIST ---------- */
  .case-list{
    display:flex;
    flex-direction:column;
    padding-bottom:70px;
  }
  .case-row{
    display:flex;
    align-items:center;
    gap:20px;
    padding:16px 4px;
    border-bottom:1px solid var(--hair);
    cursor:pointer;
    transition:background .15s ease, padding-left .15s ease;
  }
  .case-row:first-child{
    border-top:1px solid var(--hair);
  }
  .case-row:hover{
    background:var(--ink-2);
    padding-left:10px;
  }
  .case-thumb{
    flex-shrink:0;
    width:104px;
    height:70px;
    overflow:hidden;
    background:var(--ink-2);
    border:1px solid var(--hair);
    position:relative;
  }
  .case-thumb img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:top left;
    display:block;
    filter:saturate(0.92);
  }
  .case-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(135deg, var(--ink-2), var(--ink-2) 8px, #20242b 8px, #20242b 16px);
  }
  .case-thumb.emoji{
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
    background:var(--ink-2);
  }
  .case-thumb.placeholder .ph-dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--slate);
  }

  .section-divider{
    margin:8px 0 36px;
  }

  /* ---------- CASE STUDY DETAIL ---------- */
  .snapshot-inline{
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--hair);
  }
  .snapshot-inline p{
    margin:0 0 8px;
    font-size:14.5px;
    line-height:1.6;
    color:var(--bone-dim);
  }
  .snapshot-inline p:last-child{margin-bottom:0;}
  .snap-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--brass);
    margin-right:10px;
  }
  .bullet-list{
    margin:0; padding:0;
    list-style:none;
  }
  .bullet-list li{
    position:relative;
    padding-left:18px;
    margin-bottom:10px;
    font-size:15px;
    line-height:1.65;
    color:var(--bone-dim);
  }
  .bullet-list li:last-child{margin-bottom:0;}
  .bullet-list li::before{
    content:"—";
    position:absolute;
    left:0;
    color:var(--brass);
  }
  .sub-challenge{
    border-left:2px solid var(--brass);
    padding-left:20px;
    margin:24px 0;
  }
  .sub-challenge .sub-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brass);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  .case-emoji-badge{
    font-size:34px;
    line-height:1;
    margin-bottom:10px;
    display:block;
  }
  .company-stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:4px 9px;
    border:1.3px solid var(--brass);
    color:var(--brass);
    border-radius:2px;
    white-space:nowrap;
  }
  .case-role{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--slate);
    margin:2px 0 4px;
  }
  .case-body{
    flex-grow:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .case-top{
    display:flex; align-items:baseline; gap:12px;
  }
  .case-row h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:16.5px;
    font-weight:600;
    margin:0;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .case-teaser{
    font-size:13px;
    line-height:1.4;
    color:var(--bone-dim);
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    padding:3px 7px;
    border:1.3px solid currentColor;
    border-radius:2px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .stamp.live{color:var(--sage);}
  .stamp.beta{color:var(--gold);}
  .stamp.build{color:var(--rust);}
  .stamp.engine{color:var(--brass);}

  .case-arrow{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    color:var(--brass);
    font-size:14px;
    transition:transform .15s ease;
  }
  .case-row:hover .case-arrow{transform:translateX(4px);}

  @media (max-width:600px){
    .case-thumb{width:76px; height:52px;}
    .case-teaser{white-space:normal;}
    .case-row h3{font-size:14.5px;}
  }

  footer.site{
    border-top:1px solid var(--hair);
    padding:56px 0 50px;
  }
  .contact-label{
    padding:0 0 26px;
    margin-bottom:26px;
  }
  .contact-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .contact-item{
    display:flex;
    flex-direction:column;
    gap:6px;
    border:1px dashed var(--hair);
    padding:14px 18px;
    min-width:170px;
    flex-grow:1;
    transition:border-color .15s ease, background .15s ease;
  }
  .contact-item:hover{
    border-color:var(--brass);
    background:var(--ink-2);
  }
  .contact-item .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--slate);
  }
  .contact-item .value{
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--bone);
    letter-spacing:0.01em;
  }
  .footer-bottom{
    margin-top:32px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--slate);
  }

  /* ---------- DETAIL SCREEN ---------- */
  .detail{
    padding:44px 0 90px;
    animation:fadein .25s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bone-dim);
    cursor:pointer;
    margin-bottom:40px;
    background:none; border:none;
  }
  .back-link:hover{color:var(--brass);}

  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:24px;
    border-bottom:1px solid var(--hair);
    padding-bottom:34px;
    margin-bottom:40px;
    flex-wrap:wrap;
  }
  .detail-head h1{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-weight:700;
    font-size:clamp(32px, 5vw, 50px);
    margin:0 0 12px;
    line-height:1.03;
  }
  .detail-head .tagline{
    font-size:17px;
    color:var(--brass);
    max-width:520px;
    line-height:1.5;
    margin:0;
  }
  .detail-stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:9px 16px;
    border:2px solid currentColor;
    border-radius:2px;
    transform:rotate(-3deg);
    white-space:nowrap;
    flex-shrink:0;
  }

  .detail-grid{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:56px;
  }
  @media (max-width:760px){
    .detail-grid{grid-template-columns:1fr;}
  }

  .block{margin-bottom:38px;}
  .block h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .block h4::before{
    content:"";
    width:16px; height:1px; background:var(--brass);
  }
  .block p{
    font-size:15.5px;
    line-height:1.75;
    color:var(--bone-dim);
    margin:0 0 14px;
  }
  .block p:last-child{margin-bottom:0;}
  .block strong{color:var(--bone);font-weight:600;}

  .iter-block{
    border-left:2px solid var(--hair);
    padding-left:20px;
    margin-bottom:30px;
  }
  .iter-block .iter-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .iter-block h5{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:17px;
    margin:0 0 10px;
    color:var(--bone);
  }

  aside.rail{
    align-self:start;
  }
  .rail-box{
    border:1px solid var(--hair);
    background:var(--ink-2);
    padding:22px;
    margin-bottom:20px;
  }
  .rail-box h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--slate);
    margin:0 0 14px;
  }
  .rail-chip-list{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .rail-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--bone-dim);
    border:1px solid var(--hair);
    padding:6px 10px;
  }
  .status-line{
    font-size:13.5px;
    line-height:1.6;
    color:var(--bone-dim);
  }
  .status-line b{color:var(--bone);}

  .next-project{
    margin-top:50px;
    padding-top:30px;
    border-top:1px solid var(--hair);
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }

  /* ---------- SCREENSHOT GALLERY ---------- */
  .gallery-block{
    margin-bottom:44px;
  }
  .gallery{
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .shot{
    border:1px solid var(--hair);
    background:var(--ink-2);
    overflow:hidden;
  }
  .shot img{
    display:block;
    width:100%;
    height:auto;
    border-bottom:1px solid var(--hair);
  }
  .shot figcaption{
    margin:0;
    padding:14px 16px;
    font-size:12.5px;
    line-height:1.55;
    color:var(--bone-dim);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .shot figcaption b{color:var(--brass);}
  .shot img{cursor:zoom-in;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200;
    background:rgba(10,12,15,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:50px 24px;
    cursor:zoom-out;
    animation:lbfade .15s ease;
  }
  @keyframes lbfade{from{opacity:0;} to{opacity:1;}}
  .lightbox img{
    max-width:100%; max-height:75vh;
    border:1px solid var(--hair);
    cursor:default;
  }
  .lightbox .lightbox-caption{
    max-width:720px;
    margin-top:18px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    line-height:1.6;
    color:var(--bone-dim);
    text-align:center;
    cursor:default;
  }
  .lightbox .lightbox-close{
    position:absolute;
    top:26px; right:30px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bone-dim);
    border:1px solid var(--hair);
    background:var(--ink-2);
    padding:8px 14px;
    cursor:pointer;
  }
  .lightbox .lightbox-close:hover{color:var(--bone); border-color:var(--brass);}

  .next-project:hover .np-title{color:var(--brass);}
  .np-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .np-title{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:22px;
    font-weight:600;
    transition:color .18s ease;
  }

  #app{min-height:100vh;}
  @media (max-width:600px){
    .nav-links{display:none;}
    .detail-head{flex-direction:column;}
  }
</style>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<div id="app"></div>

<script>
const CONTACT = {
  name:"Melvin Paul",
  email:"melvinpaul950@gmail.com",
  phone:"437-286-9635",
  linkedin:"https://www.linkedin.com/in/melvin-paul-cspo%C2%AE-csm%C2%AE-5b898a125/",
  github:"https://github.com/mpaul3",
  resume:"resume.pdf"
};

function navHTML(crumb){
  const brand = crumb
    ? `<a href="#/">MELVIN PAUL</a> <span class="crumb-sep">/</span> <a href="#/">BUILDS</a> <span class="crumb-sep">/</span> <span class="crumb-current">${crumb.toUpperCase()}</span>`
    : `<a href="#/">MELVIN PAUL <span>/ BUILDS</span></a>`;
  return `
    <header class="site">
      <div class="wrap nav-row">
        <div class="nav-brand">${brand}</div>
        <div class="nav-links">
          <a href="#/">Work</a>
          <a href="javascript:void(0)" onclick="scrollToContact()">Contact</a>
        </div>
      </div>
    </header>
  `;
}

function scrollToContact(){
  const el = document.getElementById('contact');
  if(el) el.scrollIntoView({behavior:'smooth'});
}

function footerHTML(){
  return `
    <footer class="site" id="contact">
      <div class="wrap">
        <div class="section-label contact-label">
          <h2>Contact</h2>
          <span class="note">Reach out directly</span>
        </div>
        <div class="contact-grid">
          <a class="contact-item" href="mailto:${CONTACT.email}">
            <span class="label">Email</span>
            <span class="value">${CONTACT.email}</span>
          </a>
          <a class="contact-item" href="tel:${CONTACT.phone.replace(/-/g,'')}">
            <span class="label">Phone</span>
            <span class="value">${CONTACT.phone}</span>
          </a>
          <a class="contact-item" href="${CONTACT.linkedin}" target="_blank" rel="noopener">
            <span class="label">LinkedIn</span>
            <span class="value">View profile →</span>
          </a>
          <a class="contact-item" href="${CONTACT.github}" target="_blank" rel="noopener">
            <span class="label">GitHub</span>
            <span class="value">mpaul3 →</span>
          </a>
          <a class="contact-item" href="${CONTACT.resume}" target="_blank" rel="noopener">
            <span class="label">Resume</span>
            <span class="value">Download PDF →</span>
          </a>
        </div>
        <div class="footer-bottom">${CONTACT.name} · Toronto</div>
      </div>
    </footer>
  `;
}

const CASE_STUDIES = [
  {
    id:"lbmx-pay",
    emoji:"💳",
    title:"LBMX Pay",
    fullTitle:"Redesigning Invoice Review Before Payment",
    teaser:"AP teams weren't facing five separate screen problems; they were losing confidence across one connected workflow. Redesigning invoice review end-to-end contributed to a ~35% reduction in processing effort.",
    company:"LBMX",
    role:"Product Manager, Payments",
    scope:"Pre-payment invoice review workflow: search, status, inspection, modification, validation, and payment submission",
    stakeholders:"Enterprise accounts payable teams, Operations, Customer Success, Design, Engineering",
    context:"Enterprise customers on LBMX processed large volumes of supplier invoices before releasing payments. The workflow spanned several dependent steps: locating invoices, reviewing details, making adjustments, resolving exceptions, and confirming payment, all of which had to be completed correctly before money moved. Early conversations surfaced specific complaints: search was difficult, review views were cluttered, editing was awkward. These read as symptoms, not the actual problem.",
    challenge:"Mapping how AP users actually moved through the product clarified the real issue. They weren't facing five separate problems; they were struggling through one connected sequence: find invoice, understand status, inspect details, make corrections, validate, proceed to payment. Each step depended on the last. Uncertainty about an invoice's status eroded confidence before the editing step even began; friction at correction slowed validation; anything unresolved at the end created hesitation before payment. Improving individual screens wouldn't fix that. The product had to work as a workflow, not a set of features.",
    myRole:[
      "Ran discovery with enterprise AP users to see where they slowed down, lost confidence, or left the product to find information",
      "Mapped the end-to-end pre-payment workflow and identified where friction accumulated across the chain",
      "Reframed the product work from fixing individual screens to designing for the complete review sequence",

      <div class="case-thumb emoji">${cs.emoji}</div>
      <div class="case-body">
        <h3>${cs.title}</h3>
        <div class="case-role">${cs.role}</div>
        <p class="case-teaser">${cs.teaser}</p>
      </div>
      <div class="case-arrow">→</div>
    </div>
  `).join('');

  const projRows = PROJECTS.map(p => {
    const thumb = (p.screenshots && p.screenshots.length)
      ? `<div class="case-thumb"><img src="${p.screenshots[0].src}" alt="${p.title} preview" loading="lazy"></div>`
      : `<div class="case-thumb placeholder"><span class="ph-dot"></span></div>`;
    const teaser = p.teaser || p.tag;
    return `
    <div class="case-row" onclick="location.hash='#/project/${p.id}'">
      ${thumb}
      <div class="case-body">
        <div class="case-top">
          <h3>${p.title}</h3>
          <span class="stamp ${statusClass(p.status)}">${p.statusLabel}</span>
        </div>
        <p class="case-teaser">${teaser}</p>
      </div>
      <div class="case-arrow">→</div>
    </div>
  `;
  }).join('');

  const stats = STATS.map(s => `
    <div class="ticket-stat"><b>${s.n}</b>${s.label}</div>
  `).join('');

  document.getElementById('app').innerHTML = `
    ${navHTML()}

    <section class="hero">
      <div class="wrap">
        <div class="eyebrow">Product Manager · Toronto</div>
        <h1>Product manager who<br><em>leads</em> the work and<br><em>builds</em> the proof.</h1>
        <p class="lead">8+ years leading discovery, product direction, and delivery across enterprise B2B, fintech, and payments. This portfolio pairs that professional case work with independently designed and built AI products, shipped end to end.</p>
        <div class="ticket-row">${stats}</div>
      </div>
    </section>

    <section class="wrap">
      <div class="section-label">
        <h2>Case Studies</h2>
        <span class="note">Professional work, discovery through delivery</span>
      </div>
      <div class="case-list section-divider">${csRows}</div>

      <div class="section-label">
        <h2>Side Projects</h2>
        <span class="note">Independently designed, built, and shipped end to end</span>
      </div>
      <div class="case-list">${projRows}</div>
    </section>

    ${footerHTML()}
  `;
}

function renderDetail(id){
  const p = PROJECTS.find(x => x.id === id);
  if(!p){ location.hash = '#/'; return; }
  const idx = PROJECTS.indexOf(p);
  const next = PROJECTS[(idx + 1) % PROJECTS.length];

  let bodyHTML = '';
  if(p.isIteration){
    bodyHTML = `
      <div class="block">
        <h4>The Problem</h4>
        <p>${p.problem}</p>
      </div>
      <div class="block">
        <h4>What Was Built — Two Iterations</h4>
        ${p.iterations.map(it => `
          <div class="iter-block">
            <div class="iter-label">${it.label}</div>
            <h5>${it.title}</h5>
            <p>${it.text}</p>
          </div>
        `).join('')}
      </div>
    `;
  } else {
    bodyHTML = `
      <div class="block">
        <h4>The Problem</h4>
        <p>${p.problem}</p>
      </div>
      <div class="block">
        <h4>What Was Built</h4>
        ${p.built.map(t => `<p>${t}</p>`).join('')}
      </div>
    `;
  }

  const galleryHTML = (p.screenshots && p.screenshots.length) ? `
    <div class="block gallery-block">
      <h4>From the Build</h4>
      <div class="gallery">
        ${p.screenshots.map(s => `
          <figure class="shot">
            <img src="${s.src}" alt="${p.title} screenshot" loading="lazy" data-caption="${s.caption}" onclick="openLightbox(this)">
            <figcaption>${s.caption}</figcaption>
          </figure>
        `).join('')}
      </div>
    </div>
  ` : '';

  document.getElementById('app').innerHTML = `
    ${navHTML(p.title)}

    <div class="wrap detail">
      <button class="back-link" onclick="location.hash='#/'">← Back to home</button>

      <div class="detail-head">
        <div>
          <h1>${p.title}</h1>
          <p class="tagline">${p.tagline}</p>
        </div>
        <span class="detail-stamp ${statusClass(p.status)}">${p.statusLabel}</span>
      </div>

      <div class="detail-grid">
        <div>
          ${bodyHTML}
          ${galleryHTML}
        </div>

        <aside class="rail">
          <div class="rail-box">
            <h4>Tech Stack</h4>
            <div class="rail-chip-list">
              ${p.stack.map(s => `<span class="rail-chip">${s}</span>`).join('')}
            </div>
          </div>
          <div class="rail-box">
            <h4>Status</h4>
            <p class="status-line">${p.statusLog}</p>
          </div>
        </aside>
      </div>

      <div class="next-project" onclick="location.hash='#/project/${next.id}'">
        <div>
          <div class="np-label">Next build</div>
          <div class="np-title">${next.title}</div>
        </div>
        <div class="np-title">→</div>
      </div>
    </div>

    ${footerHTML()}
  `;
  window.scrollTo(0,0);
}

function renderCaseStudy(id){
  const cs = CASE_STUDIES.find(x => x.id === id);
  if(!cs){ location.hash = '#/'; return; }
  const idx = CASE_STUDIES.indexOf(cs);
  const next = CASE_STUDIES[(idx + 1) % CASE_STUDIES.length];

  const subChallengeHTML = cs.subChallengeLabel ? `
    <div class="sub-challenge">
      <div class="sub-label">Challenge — ${cs.subChallengeLabel}</div>
      <p style="font-size:15px; line-height:1.7; color:var(--bone-dim); margin:0;">${cs.subChallengeText}</p>
    </div>
    <div class="block">
      <h4>What I Did</h4>
      <ul class="bullet-list">
        ${cs.whatIDid.map(t => `<li>${t}</li>`).join('')}
      </ul>
    </div>
  ` : '';

  document.getElementById('app').innerHTML = `
    ${navHTML(cs.title)}

    <div class="wrap detail">
      <button class="back-link" onclick="location.hash='#/'">← Back to home</button>

      <div class="detail-head">
        <div>
          <span class="case-emoji-badge">${cs.emoji}</span>
          <h1>${cs.title}</h1>
          <p class="tagline">${cs.fullTitle}</p>
        </div>
        <span class="company-stamp">${cs.company}</span>
      </div>

      <div class="detail-grid">
        <div>
          <div class="block">
            <div class="snapshot-inline">
              <p><span class="snap-label">Company</span>${cs.company}</p>
              <p><span class="snap-label">Role</span>${cs.role}</p>
              <p><span class="snap-label">Scope</span>${cs.scope}</p>
              <p><span class="snap-label">Stakeholders</span>${cs.stakeholders}</p>
            </div>
          </div>

          <div class="block">
            <h4>Context</h4>
            <p>${cs.context}</p>
          </div>

          <div class="block">
            <h4>Challenge</h4>
            <p>${cs.challenge}</p>
          </div>

          <div class="block">
            <h4>My Role</h4>
            <ul class="bullet-list">
              ${cs.myRole.map(t => `<li>${t}</li>`).join('')}
            </ul>
          </div>

          ${subChallengeHTML}

          <div class="block">
            <h4>Outcome / Impact</h4>
            <p>${cs.outcome}</p>
          </div>
        </div>

        <aside class="rail">
          <div class="rail-box">
            <h4>Tools &amp; Ways of Working</h4>
            <div class="rail-chip-list">
              ${cs.tools.map(s => `<span class="rail-chip">${s}</span>`).join('')}
            </div>
          </div>
          <div class="rail-box">
            <h4>What This Demonstrates</h4>
            <div class="rail-chip-list">
              ${cs.demonstrates.map(s => `<span class="rail-chip">${s}</span>`).join('')}
            </div>
          </div>
        </aside>
      </div>

      <div class="next-project" onclick="location.hash='#/case-study/${next.id}'">
        <div>
          <div class="np-label">Next case study</div>
          <div class="np-title">${next.title}</div>
        </div>
        <div class="np-title">→</div>
      </div>
    </div>

    ${footerHTML()}
  `;
  window.scrollTo(0,0);
}

function openLightbox(imgEl){
  closeLightbox();
  const overlay = document.createElement('div');
  overlay.className = 'lightbox';
  overlay.id = 'lightbox-overlay';
  overlay.onclick = closeLightbox;
  overlay.innerHTML = `
    <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox();">Close ✕</button>
    <img src="${imgEl.src}" alt="${imgEl.alt}">
    <p class="lightbox-caption">${imgEl.dataset.caption || ''}</p>
  `;
  document.body.appendChild(overlay);
}
function closeLightbox(){
  const existing = document.getElementById('lightbox-overlay');
  if(existing) existing.remove();
}
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

function router(){
  const hash = location.hash || '#/';
  const projectMatch = hash.match(/^#\/project\/(.+)$/);
  const caseStudyMatch = hash.match(/^#\/case-study\/(.+)$/);
  if(projectMatch){
    renderDetail(projectMatch[1]);
  } else if(caseStudyMatch){
    renderCaseStudy(caseStudyMatch[1]);
  } else {
    renderHome();
  }
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();
</script>
</body>
</html>
